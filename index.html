        /* ---- 底部推荐区域 ---- */

<body>

    <script>
        (function() {
            'use strict';

            // ========== 安全防护 ==========
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                const key = e.key.toLowerCase();
                const ctrl = e.ctrlKey || e.metaKey;
                if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
                if (ctrl && e.shiftKey && (key === 'i' || key === 'j')) { e.preventDefault(); return false; }
                if (ctrl && key === 'u') { e.preventDefault(); return false; }
                if (ctrl && key === 's') { e.preventDefault(); return false; }
                return true;
            });
            ['copy', 'cut', 'paste', 'dragstart', 'drop'].forEach(evt => {
                document.addEventListener(evt, e => e.preventDefault());
            });

            // ========== DOM ==========
            const form = document.getElementById('uploadForm');
            const fileInput = document.getElementById('fileInput');
            const msgDiv = document.getElementById('message');
            const dropZone = document.getElementById('dropZone');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileSelectorBtn = document.getElementById('fileSelectorBtn');
            const dropSubtext = document.getElementById('dropSubtext');

            // ========== 工具 ==========
            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            function showMessage(html, type) {
                msgDiv.innerHTML = html;
                msgDiv.className = type || '';
            }

            // ========== 复制功能 ==========
            function copyToClipboard(text, btnElement) {
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showCopyFeedback(btnElement);
                    }).catch(() => {
                        fallbackCopy(text, btnElement);
                    });
                } else {
                    fallbackCopy(text, btnElement);
                }
            }

            function fallbackCopy(text, btnElement) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showCopyFeedback(btnElement);
                } catch (e) {
                    alert('复制失败，请手动复制。');
                }
                document.body.removeChild(textarea);
            }

            function showCopyFeedback(btnElement) {
                const originalHtml = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="fas fa-check"></i> 已复制';
                btnElement.classList.add('copied');
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.classList.remove('copied');
                }, 2000);
            }

            // ========== 更新拖拽区 ==========
            function updateDropSubtext(file) {
                if (file) {
                    const sizeStr = formatFileSize(file.size);
                    dropSubtext.innerHTML = `<span class="file-badge"><i class="far fa-file"></i> ${escapeHtml(file.name)}</span>  ${sizeStr}`;
                } else {
                    dropSubtext.innerHTML = '支持 PNG, JPG, PDF, ZIP 等';
                }
            }

            // ========== 核心上传 ==========
            async function handleUpload(file) {
                if (!file) {
                    showMessage('<i class="fas fa-exclamation-circle" style="margin-right:8px;"></i> 请先选择一个文件。', 'error');
                    return;
                }

                showMessage(`
                    <div style="display:flex; align-items:center; gap:14px;">
                        <span class="spinner-ring"></span>
                        <span style="font-weight:500;">正在加密上传…</span>
                    </div>
                `, '');

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch('https://api.xinyew.cn/api/360tc', {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        throw new Error(`服务器响应异常 (${response.status})`);
                    }

                    const data = await response.json();

                    if (data.errno === 0 && data.data && data.data.url) {
                        const imgUrl = data.data.url;
                        const fileName = data.data.imgFile || file.name;

                        // 构建带复制按钮的链接区域
                        const linkHtml = `
                            <div class="link-wrapper">
                                <span style="font-size:0.9rem; word-break:break-all;">
                                    <i class="fas fa-link"></i> 
                                    <a href="${escapeHtml(imgUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(imgUrl)}</a>
                                </span>
                                <button class="copy-btn" data-copy="${escapeHtml(imgUrl)}" title="复制链接">
                                    <i class="far fa-copy"></i> 复制
                                </button>
                            </div>
                        `;

                        const successHtml = `
                            <div style="display:flex; flex-direction:column; gap:0.6rem;">
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <i class="fas fa-check-circle" style="color:#1e7e34; font-size:1.3rem;"></i>
                                    <span style="font-weight:600; font-size:1.05rem;">上传成功</span>
                                </div>
                                <div class="file-meta">
                                    <span class="file-badge"><i class="far fa-file"></i> ${escapeHtml(fileName)}</span>
                                    <span style="color:#3d5a73;">${formatFileSize(file.size)}</span>
                                </div>
                                ${linkHtml}
                                <img src="${escapeHtml(imgUrl)}" alt="预览图" loading="lazy" />
                            </div>
                        `;
                        showMessage(successHtml, 'success');

                        // 为复制按钮绑定事件 (动态生成)
                        const copyBtn = msgDiv.querySelector('.copy-btn');
                        if (copyBtn) {
                            const url = copyBtn.getAttribute('data-copy');
                            copyBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                copyToClipboard(url, this);
                            });
                        }
                    } else {
                        const errorMsg = data.error || '上传失败，请重试。';
                        showMessage(`<i class="fas fa-times-circle" style="margin-right:8px;"></i> ${escapeHtml(errorMsg)}`, 'error');
                    }
                } catch (error) {
                    console.warn('Upload error:', error);
                    showMessage(`<i class="fas fa-times-circle" style="margin-right:8px;"></i> 网络错误: ${escapeHtml(error.message)}`, 'error');
                }
            }

            // ========== 事件绑定 ==========

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const file = fileInput.files[0];
                handleUpload(file);
            });

            fileInput.addEventListener('change', function(e) {
                const file = this.files[0];
                updateDropSubtext(file);
            });

            fileSelectorBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                fileInput.click();
            });

            dropZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    fileInput.files = dt.files;
                    const evt = new Event('change', { bubbles: true });
                    fileInput.dispatchEvent(evt);
                    handleUpload(file);
                }
            });

            dropZone.addEventListener('click', function(e) {
                if (e.target.closest('.file-selector-btn') || e.target.closest('input')) return;
                fileInput.click();
            });

            // 初始状态
            showMessage('<div style="display:flex; align-items:center; gap:8px; opacity:0.5; font-size:0.9rem;"><i class="fas fa-cloud"></i> 选择或拖拽文件开始</div>', '');

            console.log('🔒 专业上传系统已启动 (安全防护已激活)');
        })();
    </script>
